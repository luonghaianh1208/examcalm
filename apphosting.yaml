runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: examcalm
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: examcalm.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: examcalm.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATOR
    value: "false"
    availability: [BUILD, RUNTIME]

  # Giá trị nhạy cảm lấy từ Secret Manager, KHÔNG ghi thẳng vào file này
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: examcalm-web-api-key
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: examcalm-messaging-sender-id
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: examcalm-web-app-id
    availability: [BUILD, RUNTIME]
  # NEXT_PUBLIC_RECAPTCHA_SITE_KEY cố tình CHƯA khai báo: App Check chưa đăng ký
  # reCAPTCHA Enterprise. startAppCheck() trong client.ts thoát sớm khi biến này
  # vắng mặt, nên bỏ trống là an toàn. Thêm lại ở Spec #3 khi bật App Check.
