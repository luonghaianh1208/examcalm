<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>ExamCalm</title>
  <!--
    Favicon lấy từ CatMascot nhưng VẼ LẠI cho cỡ nhỏ, không phải chép nguyên:
    ở 16px thì râu mèo và nét mảnh biến thành vệt mờ, nên bỏ hẳn. Đầu được
    phóng to gần kín khung và có nền bo tròn để nổi trên cả tab sáng lẫn tối.
    Đổi nhận diện thương hiệu thì sửa CẢ file này lẫn CatMascot.tsx.
  -->
  <rect width="100" height="100" rx="22" fill="#0f766e" />
  <g transform="translate(0 4)">
    <path d="M20 40 L29 12 L48 30 Z" fill="#f6c9a8" />
    <path d="M80 40 L71 12 L52 30 Z" fill="#f6c9a8" />
    <circle cx="50" cy="56" r="34" fill="#fbe0cd" />
    <circle cx="37" cy="51" r="5.5" fill="#3f3a36" />
    <circle cx="63" cy="51" r="5.5" fill="#3f3a36" />
    <path d="M42 65 Q50 73 58 65" stroke="#3f3a36" stroke-width="4.5"
          fill="none" stroke-linecap="round" />
  </g>
</svg>
